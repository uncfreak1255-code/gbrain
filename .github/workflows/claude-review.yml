name: Claude Code Review

# Auto-review every pull request using Claude Code, authenticated with a
# Claude Max/Pro subscription (OAuth token) — NOT a metered API key.
#
# Setup (one time, done by a human — cannot be done from CI):
#   1. Locally run:  claude setup-token
#      (opens a browser OAuth flow, prints a long-lived sk-ant-oat01-... token)
#   2. In this repo: Settings -> Secrets and variables -> Actions ->
#      New repository secret, name it exactly CLAUDE_CODE_OAUTH_TOKEN.
#
# Billing: usage draws down the subscription's rate/usage window (same pool as
# interactive claude.ai / Claude Code usage). No per-token API charges.
# Do NOT also set anthropic_api_key — if both are present the API key wins and
# usage is billed to the API account instead.
#
# Until the secret is added, the review step is skipped (green, no billing).

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  claude-review:
    # Skip drafts and bot authors to conserve subscription quota.
    if: >-
      github.event.pull_request.draft == false &&
      github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check for OAuth token
        id: guard
        env:
          TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          if [ -n "$TOKEN" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice::CLAUDE_CODE_OAUTH_TOKEN is not set — skipping Claude review. Run 'claude setup-token' locally and add the CLAUDE_CODE_OAUTH_TOKEN repo secret to enable it."
          fi

      - name: Checkout
        if: steps.guard.outputs.enabled == 'true'
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Claude Code Review
        if: steps.guard.outputs.enabled == 'true'
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          claude_args: "--max-turns 8"
          prompt: |
            Review this pull request against gbrain's cross-cutting invariants
            (see CLAUDE.md). Focus on:
            - Correctness bugs and security issues in the diff.
            - Engine parity: src/core/postgres-engine.ts and pglite-engine.ts
              must move in lockstep — a new SQL shape/method must land in BOTH.
            - Source isolation: read-side ops must route through
              sourceScopeOpts(ctx); flag hand-rolled source filtering.
            - Contract-first: src/core/operations.ts is the single source for
              CLI + MCP; flag scope/localOnly regressions.
            - JSONB: never JSON.stringify into a ::jsonb cast.
            - Test coverage for the changed behavior.
            Flag real issues with file:line and cite the invariant. Be concise;
            skip style nitpicks. If the diff is clean, say so briefly.
